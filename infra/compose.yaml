name: espaco_dialogico
services:
  espaco_dialogico:
    container_name: espaco_dialogico
    image: "postgres:16.0-alpine3.18"
    env_file:
      - ../.env.development.local
    ports:
      - "5434:5432"

  mailpit:
    container_name: espaco_dialogico_mailpit
    image: "axllent/mailpit:latest"
    ports:
      - "1025:1025"
      - "8025:8025"
